services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-net

  backend:
    image: ${GHCR_IMAGE_PREFIX}-backend:latest
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      - database
    networks:
      - app-net

  nginx:
    image: ${GHCR_IMAGE_PREFIX}-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-net

  frontend:
    image: ${GHCR_IMAGE_PREFIX}-frontend:latest
    restart: unless-stopped
    volumes:
      - frontend-dist:/shared
    networks:
      - app-net

volumes:
  postgres-data:
  frontend-dist:

networks:
  app-net:
    driver: bridge
